<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>


<body>

<main class="admin-page">

    <!-- LEFT SIDE -->
    <section class="admin-intro">

        <div class="admin-brand">

            <img
                src="./campusfind-logo.png"
                alt="CampusFind Logo"
                class="admin-logo"
            >

            <div class="admin-brand-text">

                <a href="index.html" class="admin-brand-name">
                    Campus<span>Find</span>
                </a>

                <div class="admin-brand-college">
                    <span></span>
                    GCET
                    <span></span>
                </div>

            </div>

        </div>


        <div class="admin-message">


            <h1>
                Admin<br>
                <span>Portal</span>
            </h1>

            <p>
                Manage reported items, review claims and
                help reconnect lost belongings with their owners.
            </p>

        </div>

    </section>


    <!-- RIGHT SIDE -->
    <section class="admin-form-section">

        <div class="admin-card">

            <div class="admin-icon">
                ⚙
            </div>


            <div class="admin-heading">

                <h2>Admin Login</h2>

                <p>
                    Sign in to access the CampusFind admin panel.
                </p>

            </div>


            <form id="adminLoginForm">

                <!-- ADMIN ID -->

                <div class="admin-form-group">

                    <label for="adminId">
                        Admin ID
                    </label>

                    <input
                        type="text"
                        id="adminId"
                        name="adminId"
                        placeholder="Enter your admin ID"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="admin-form-group">

                    <div class="admin-password-label">

                        <label for="adminPassword">
                            Password
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <div class="admin-password-input">

                        <input
                            type="password"
                            id="adminPassword"
                            name="adminPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleAdminPassword"
                            class="admin-show-password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->

                <label class="admin-remember">

                    <input
                        type="checkbox"
                        id="adminRemember"
                    >

                    <span>Remember me</span>

                </label>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="admin-submit"
                >
                    Login to Admin Panel
                    <span>→</span>
                </button>


            </form>


            <!-- BACK TO USER LOGIN -->

            <p class="back-to-login">

                Not an admin?

                <a href="login.html">
                    User Login
                </a>

            </p>


            <div class="admin-divider">

                <span></span>

                <a href="index.html">
                    ← Back to CampusFind
                </a>

                <span></span>

            </div>

        </div>

    </section>

</main>


<script>

const adminPassword =
    document.getElementById("adminPassword");

const toggleAdminPassword =
    document.getElementById("toggleAdminPassword");


toggleAdminPassword.addEventListener("click", function () {

    if (adminPassword.type === "password") {

        adminPassword.type = "text";
        toggleAdminPassword.textContent = "🙈";

    } else {

        adminPassword.type = "password";
        toggleAdminPassword.textContent = "👁";

    }

});


document
    .getElementById("adminLoginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
            "Admin login functionality will be connected to the backend soon."
        );

    });

</script>

</body>

</html>
