<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">    

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Login Page -->

    <main class="login-page">

        <!-- Left Side -->
        <section class="login-intro">

            <div class="login-brand">

                <img 
                    src="./campusf-logo.png"
                    alt="CampusFind Logo"
                    class="login-logo"
                >

            

        </section>


        <!-- Right Side Login Card -->
        <section class="login-form-section">

            <div class="login-card">

                <div class="login-heading">

                    <h2>Login</h2>

                    <p>
                        Sign in to continue to CampusFind.
                    </p>

                </div>


                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter your email or student ID"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <div class="password-label">

                            <label for="password">
                                Password
                            </label>

                            <a href="#" class="forgot-password">
                                Forgot Password?
                            </a>

                        </div>

                        <div class="password-input">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="show-password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- Remember Me -->
                    <div class="remember-row">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            <span>Remember me</span>

                        </label>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Login
                        <span>→</span>
                    </button>


                    <!-- Register -->
                    <p class="register-text">

                        Don't have an account?

                        <a href="register.html">
                            Create Account
                        </a>

                    </p>

                </form>


                <!-- Admin Login -->
                <div class="admin-login">

                    <span></span>

                    <a href="#">
                        Admin Login →
                    </a>

                    <span></span>

                </div>

            </div>

        </section>

    </main>


    <script>

        // Show / Hide Password

        const togglePassword =
            document.getElementById("togglePassword");

        const password =
            document.getElementById("password");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                togglePassword.textContent = "🙈";

            } else {

                password.type = "password";
                togglePassword.textContent = "👁";

            }

        });



const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:5000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Login failed. Please try again.");
            return;
        }

        // Save user details and JWT token for authenticated requests
sessionStorage.setItem("campusfindUser", JSON.stringify(data.user));
sessionStorage.setItem("campusfindToken", data.token);

        alert("Login successful! Welcome, " + data.user.name + "!");

        // Temporary destination until we build the dashboard
        window.location.href = "dashboard.html";

    } catch (error) {
        console.error("Login error:", error);
        alert("Cannot connect to the server. Please try again.");
    }
});



    </script>

</body>

</html>
