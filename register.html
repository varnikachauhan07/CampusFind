<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<main class="register-page">

    <!-- LEFT SIDE -->
    <section class="register-intro">

        <div class="register-brand">

            <img
                src="./campusfind-logo.png"
                alt="CampusFind Logo"
                class="register-logo"
            >

            <div class="register-brand-text">

                <a href="index.html" class="register-brand-name">
                    Campus<span>Find</span>
                </a>

                <div class="register-brand-college">
                    <span></span>
                    GCET
                    <span></span>
                </div>

            </div>

        </div>


        <div class="register-message">

            <p class="register-small-heading">
                GCET • LOST & FOUND
            </p>

            <h1>
                Join the<br>
                <span>community!</span>
            </h1>

            <p>
                Create your CampusFind account and make
                it easier to report, discover and return
                lost belongings across campus.
            </p>

        </div>

    </section>


    <!-- RIGHT SIDE -->
    <section class="register-form-section">

        <div class="register-card">

            <div class="register-heading">

                <h2>Create Account</h2>

                <p>
                    Register to get started with CampusFind.
                </p>

            </div>


            <form id="registerForm">

                <!-- NAME -->
                <div class="register-form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="register-form-group">

                    <label for="email">
                        College Email / Student ID
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email or student ID"
                        required
                    >

                </div>


                <!-- ROLE -->
                <div class="register-form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select id="role" name="role" required>

                        <option value="" disabled selected>
                            Select account type
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="faculty">
                            Faculty / Staff
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->
                <div class="register-form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="register-password-input">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="register-show-password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="register-form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="register-password-input">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="register-show-password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- TERMS -->
                <label class="register-terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to use CampusFind responsibly
                        and provide accurate information.
                    </span>

                </label>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="register-submit"
                >
                    Create Account <span>→</span>
                </button>


                <!-- LOGIN -->
                <p class="login-existing">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>


            <!-- ADMIN -->
            <div class="register-admin">

                <span></span>

                <a href="#">
                    Admin Login →
                </a>

                <span></span>

            </div>

        </div>

    </section>

</main>


<script>

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const togglePassword =
    document.getElementById("togglePassword");

const toggleConfirmPassword =
    document.getElementById("toggleConfirmPassword");


togglePassword.addEventListener("click", function () {

    if (password.type === "password") {

        password.type = "text";
        togglePassword.textContent = "🙈";

    } else {

        password.type = "password";
        togglePassword.textContent = "👁";

    }

});


toggleConfirmPassword.addEventListener("click", function () {

    if (confirmPassword.type === "password") {

        confirmPassword.type = "text";
        toggleConfirmPassword.textContent = "🙈";

    } else {

        confirmPassword.type = "password";
        toggleConfirmPassword.textContent = "👁";

    }

});


document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        if (password.value !== confirmPassword.value) {

            alert("Passwords do not match.");
            return;

        }

        alert("Registration functionality will be connected to the backend soon.");

    });

</script>

</body>
</html>
